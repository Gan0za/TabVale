<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Custom New Tab</title>
</head>
<body>
    <div class="container" id="main-container">
        <h1 data-i18n="pageTitle">Новая вкладка</h1>

        <div id="search-container">
            <div class="search-row">
                <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Поиск..." autocomplete="off">
                <div id="search-engine-dropdown" class="dropdown">
                    <button id="search-engine-button" class="dropdown-button">
                        <img id="selected-engine-icon" src="" alt="">
                        <span id="selected-engine-name">DuckDuckGo</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div id="search-engine-list" class="dropdown-menu"></div>
                </div>
                <button id="search-button" class="btn" data-i18n="searchButton">Найти</button>
            </div>
        </div>

        <section id="bookmarks-section">
            <h2 data-i18n="bookmarksSection">Закладки</h2>
            <div id="bookmarks-container"></div>
        </section>
    </div>

    <!-- Переключатель темы (авто / светлая / тёмная), выбор языка и настройки -->
    <div class="fab-stack">
        <button id="theme-toggle" class="settings-fab" data-i18n-aria="themeToggleAria">🌗</button>
        <div id="theme-menu" class="theme-menu hidden">
            <button data-mode="auto" data-i18n="themeAuto">Авто</button>
            <button data-mode="light" data-i18n="themeLight">Светлая</button>
            <button data-mode="dark" data-i18n="themeDark">Тёмная</button>
        </div>
        <button id="language-toggle" class="settings-fab">🌐</button>
        <div id="language-menu" class="theme-menu hidden"></div>
        <button id="settings-button" class="settings-fab">⚙</button>
    </div>

    <!-- Контекстное меню: наполняется из app.js в зависимости от элемента,
         по которому кликнули правой кнопкой -->
    <div id="custom-context-menu" class="context-menu hidden"></div>

    <div id="overlay" class="hidden"></div>

    <div id="settings-modal" class="modal hidden">
        <h3 data-i18n="settingsTitle">Настройки</h3>
        <div class="settings-tabs">
            <button class="settings-tab" data-tab="general" data-i18n="generalSection">Общие</button>
            <button class="settings-tab active" data-tab="bookmarks" data-i18n="tabBookmarks">Закладки</button>
            <button class="settings-tab" data-tab="backgrounds" data-i18n="tabBackgrounds">Фоны</button>
            <button class="settings-tab" data-tab="search-engines" data-i18n="tabSearchEngines">Поисковые системы</button>
        </div>
        <div class="settings-content">
            <!-- Общие настройки: язык, тема, импорт/экспорт -->
            <div class="settings-pane" data-pane="general">
                <div class="general-row">
                    <span data-i18n="languageLabel">Язык</span>
                    <div class="dropdown">
                        <button id="language-button" class="dropdown-button">
                            <img id="selected-language-icon" class="hidden" alt="">
                            <span id="selected-language-name">🌐</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div id="language-list" class="dropdown-menu"></div>
                    </div>
                </div>
                <div class="general-row">
                    <span data-i18n="themeLabel">Тема</span>
                    <div class="dropdown">
                        <button id="theme-general-button" class="dropdown-button">
                            <span id="selected-theme-name">🌗</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div id="theme-general-list" class="dropdown-menu">
                            <button class="dropdown-item" data-mode="auto">
                                <span class="theme-icon">🌗</span><span data-i18n="themeAuto">Авто</span>
                            </button>
                            <button class="dropdown-item" data-mode="light">
                                <span class="theme-icon">☀️</span><span data-i18n="themeLight">Светлая</span>
                            </button>
                            <button class="dropdown-item" data-mode="dark">
                                <span class="theme-icon">🌙</span><span data-i18n="themeDark">Тёмная</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="general-row general-actions">
                    <button id="import-settings-json" class="btn" data-i18n="importButton">Импорт (JSON)</button>
                    <button id="export-settings-json" class="btn" data-i18n="exportButton">Экспорт (JSON)</button>
                    <button id="reset-settings" class="btn btn-danger" data-i18n="resetButton">Сбросить настройки</button>
                </div>
            </div>
            <div class="settings-pane active" data-pane="bookmarks">
                <div id="bookmark-manager-list" class="modal-list"></div>
                <button id="show-bookmark-form" class="btn" data-i18n="addButton">＋ Добавить</button>
                <div id="bookmark-form" class="add-form">
                    <div class="add-form-inner">
                        <input type="url" id="bookmark-url-input" data-i18n-placeholder="bookmarkUrlPlaceholder" placeholder="URL">
                        <div id="bookmark-details" class="add-details">
                            <div class="add-details-inner">
                                <input type="text" id="bookmark-title-input" data-i18n-placeholder="bookmarkTitlePlaceholder" placeholder="Название">
                                <div class="input-with-refresh">
                                    <input type="url" id="bookmark-icon-input" data-i18n-placeholder="iconUrlPlaceholder" placeholder="URL логотипа (опционально)">
                                    <button id="refresh-bookmark-icon" class="icon-refresh-btn" type="button" data-i18n-aria="refreshIcon" title="⟳">⟳</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button id="add-bookmark" class="btn btn-primary" data-i18n="addButtonShort">Добавить</button>
                            <button id="save-bookmark" class="btn btn-primary hidden" data-i18n="saveButton">Сохранить</button>
                            <button id="cancel-bookmark" class="btn" data-i18n="cancelButton">Отмена</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-pane" data-pane="backgrounds">
                <div id="background-manager-list" class="modal-list"></div>
                <button id="show-background-form" class="btn" data-i18n="addButton">＋ Добавить</button>
                <div id="background-form" class="add-form">
                    <div class="add-form-inner">
                        <input type="text" id="background-title-input" data-i18n-placeholder="bgTitlePlaceholder" placeholder="Название фона">
                        <!-- Переключатель типа фона: картинка / файл / цвет / градиент -->
                        <div class="bg-type-tabs">
                            <button class="bg-type-tab active" data-bg-type="url" data-i18n="bgTypeUrl">Ссылка</button>
                            <button class="bg-type-tab" data-bg-type="file" data-i18n="bgTypeFile">Устройство</button>
                            <button class="bg-type-tab" data-bg-type="color" data-i18n="bgTypeColor">Цвет</button>
                            <button class="bg-type-tab" data-bg-type="gradient" data-i18n="bgTypeGradient">Градиент</button>
                        </div>
                        <input type="url" id="background-url-input" data-i18n-placeholder="bgUrlPlaceholder" placeholder="URL изображения (пусто — по умолчанию)">
                        <input type="file" id="background-file-input" accept="image/*" class="bg-file-input">
                        <!-- Положение картинки: видно только на вкладках Ссылка и Устройство -->
                        <div id="background-position-row" class="bg-position-row hidden">
                            <label for="background-position-input" data-i18n="bgPositionLabel">Положение</label>
                            <select id="background-position-input">
                                <option value="cover" data-i18n="bgPositionCover">Растянуть</option>
                                <option value="contain" data-i18n="bgPositionContain">Вписать</option>
                                <option value="tile" data-i18n="bgPositionTile">Замостить</option>
                                <option value="center" data-i18n="bgPositionCenter">1:1 по центру</option>
                            </select>
                        </div>
                        <div id="background-file-preview" class="bg-file-preview hidden">
                            <img id="background-file-thumb" alt="">
                            <span id="background-file-name"></span>
                        </div>
                        <div class="bg-color-row hidden" id="background-color-row">
                            <input type="color" id="background-color-input" value="#4db6e2">
                            <span id="background-color-value">#4db6e2</span>
                        </div>
                        <div id="background-gradient-box" class="hidden">
                            <div class="gradient-presets" id="gradient-presets"></div>
                            <div class="bg-gradient-row">
                                <input type="color" id="gradient-from-input" value="#667eea">
                                <input type="color" id="gradient-to-input" value="#764ba2">
                                <input type="range" id="gradient-angle-input" min="0" max="360" step="5" value="160" data-i18n-aria="gradientAngle">
                                <span id="gradient-preview" class="gradient-preview"></span>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button id="save-background" class="btn btn-primary" data-i18n="saveButton">Сохранить</button>
                            <button id="cancel-background" class="btn" data-i18n="cancelButton">Отмена</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-pane" data-pane="search-engines">
                <div id="search-engines-list" class="modal-list"></div>
                <button id="show-search-engine-form" class="btn" data-i18n="addButton">＋ Добавить</button>
                <div id="search-engine-form" class="add-form">
                    <div class="add-form-inner">
                        <input type="text" id="new-search-engine-url" data-i18n-placeholder="engineUrlPlaceholder" placeholder="URL с %s (например https://www.google.com/search?q=%s)">
                        <div id="search-engine-details" class="add-details">
                            <div class="add-details-inner">
                                <input type="text" id="new-search-engine-name" data-i18n-placeholder="engineNamePlaceholder" placeholder="Название">
                                <div class="input-with-refresh">
                                    <input type="url" id="new-search-engine-logo" data-i18n-placeholder="iconUrlPlaceholder" placeholder="URL логотипа (опционально)">
                                    <button id="refresh-search-engine-icon" class="icon-refresh-btn" type="button" data-i18n-aria="refreshIcon" title="⟳">⟳</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button id="add-search-engine" class="btn btn-primary" data-i18n="addButtonShort">Добавить</button>
                            <button id="save-search-engine" class="btn btn-primary hidden" data-i18n="saveButton">Сохранить</button>
                            <button id="cancel-search-engine" class="btn" data-i18n="cancelButton">Отмена</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="close-settings" class="btn" data-i18n="closeButton">Закрыть</button>
        </div>
        <input id="import-settings-file" type="file" accept="application/json" style="display:none" />
    </div>

    <script src="core/config.js"></script>
    <script src="core/storage.js"></script>
    <script src="core/i18n.js"></script>
    <script src="core/render.js"></script>
    <script src="core/state.js"></script>
    <script src="features/popovers.js"></script>
    <script src="app.js"></script>
</body>
</html>
