<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Custom New Tab</title>
</head>
<body>
    <div class="container" id="main-container">
        <h1>Новая вкладка</h1>

        <div id="search-container">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Поиск..." autocomplete="off">
                <div id="search-engine-dropdown" class="dropdown">
                    <button id="search-engine-button" class="dropdown-button">
                        <img id="selected-engine-icon" src="" alt="">
                        <span id="selected-engine-name">DuckDuckGo</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div id="search-engine-list" class="dropdown-menu"></div>
                </div>
                <button id="search-button" class="btn">Найти</button>
            </div>
        </div>

        <section id="bookmarks-section">
            <h2>Закладки</h2>
            <div id="bookmarks-container"></div>
        </section>
    </div>

    <!-- Переключатель темы (авто / светлая / тёмная) и кнопка настроек -->
    <div class="fab-stack">
        <button id="theme-toggle" class="settings-fab" aria-label="Сменить тему">🌗</button>
        <div id="theme-menu" class="theme-menu hidden">
            <button data-mode="auto">Авто</button>
            <button data-mode="light">Светлая</button>
            <button data-mode="dark">Тёмная</button>
        </div>
        <button id="settings-button" class="settings-fab">⚙</button>
    </div>

    <!-- Контекстное меню: наполняется из app.js в зависимости от элемента,
         по которому кликнули правой кнопкой -->
    <div id="custom-context-menu" class="context-menu hidden"></div>

    <div id="overlay" class="hidden"></div>

    <div id="settings-modal" class="modal hidden">
        <h3>Настройки</h3>
        <div class="settings-tabs">
            <button class="settings-tab active" data-tab="bookmarks">Закладки</button>
            <button class="settings-tab" data-tab="backgrounds">Фоны</button>
            <button class="settings-tab" data-tab="search-engines">Поисковые системы</button>
        </div>
        <div class="settings-content">
            <div class="settings-pane active" data-pane="bookmarks">
                <div id="bookmark-manager-list" class="modal-list"></div>
                <button id="show-bookmark-form" class="btn">＋ Добавить</button>
                <div id="bookmark-form" class="add-form">
                    <div class="add-form-inner">
                        <input type="text" id="bookmark-title-input" placeholder="Название">
                        <input type="url" id="bookmark-url-input" placeholder="URL">
                        <input type="url" id="bookmark-icon-input" placeholder="URL логотипа (опционально)">
                        <div class="form-actions">
                            <button id="find-bookmark-logo" class="btn">Найти логотип</button>
                            <button id="save-bookmark" class="btn btn-primary">Сохранить</button>
                            <button id="cancel-bookmark" class="btn">Отмена</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-pane" data-pane="backgrounds">
                <div id="background-manager-list" class="modal-list"></div>
                <button id="show-background-form" class="btn">＋ Добавить</button>
                <div id="background-form" class="add-form">
                    <div class="add-form-inner">
                        <input type="text" id="background-title-input" placeholder="Название фона">
                        <input type="url" id="background-url-input" placeholder="URL изображения (пусто — по умолчанию)">
                        <div class="form-actions">
                            <button id="save-background" class="btn btn-primary">Сохранить</button>
                            <button id="cancel-background" class="btn">Отмена</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-pane" data-pane="search-engines">
                <div id="search-engines-list" class="modal-list"></div>
                <button id="show-search-engine-form" class="btn">＋ Добавить</button>
                <div id="search-engine-form" class="add-form">
                    <div class="add-form-inner">
                        <input type="text" id="new-search-engine-name" placeholder="Название">
                        <input type="text" id="new-search-engine-url" placeholder="URL с %s (например https://www.google.com/search?q=%s)">
                        <input type="url" id="new-search-engine-logo" placeholder="URL логотипа (опционально)">
                        <div class="form-actions">
                            <button id="find-search-engine-logo" class="btn">Найти логотип</button>
                            <button id="add-search-engine" class="btn btn-primary">Сохранить</button>
                            <button id="cancel-search-engine" class="btn">Отмена</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="import-settings-json" class="btn">Импорт (JSON)</button>
            <button id="export-settings-json" class="btn">Экспорт (JSON)</button>
            <button id="close-settings" class="btn">Закрыть</button>
        </div>
        <input id="import-settings-file" type="file" accept="application/json" style="display:none" />
    </div>

    <script src="app.js"></script>
</body>
</html>
