name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Run tests
        run: |
          for f in tests/*.test.mjs; do
            node "$f"
          done

      - name: Build extension package
        run: bash package.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tabvale-extension
          path: dist/tabvale_*.zip
          if-no-files-found: error
