<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Extension</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Тест расширения новой вкладки</h1>
    <div id="test-results"></div>

    <script>
        const results = document.getElementById('test-results');

        function addResult(message, success = true) {
            const div = document.createElement('div');
            div.className = `test-result ${success ? 'success' : 'error'}`;
            div.textContent = message;
            results.appendChild(div);
        }

        // Тест 1: Проверка загрузки HTML структуры
        try {
            const settingsButton = document.getElementById('settings-button');
            const settingsModal = document.getElementById('settings-modal');
            const tabs = document.querySelectorAll('.settings-tab');
            const panes = document.querySelectorAll('.settings-pane');

            addResult('✓ HTML структура загружена корректно');
            addResult(`✓ Найдено ${tabs.length} вкладок настроек`);
            addResult(`✓ Найдено ${panes.length} панелей настроек`);
        } catch (e) {
            addResult('✗ Ошибка загрузки HTML структуры: ' + e.message, false);
        }

        // Тест 2: Проверка загрузки JavaScript
        try {
            // Имитируем загрузку app.js
            const script = document.createElement('script');
            script.src = 'app.js';
            script.onload = () => {
                addResult('✓ JavaScript файл загружен');
                // Проверяем наличие основных функций
                setTimeout(() => {
                    if (typeof renderBookmarks === 'function') {
                        addResult('✓ Функция renderBookmarks найдена');
                    } else {
                        addResult('✗ Функция renderBookmarks не найдена', false);
                    }

                    if (typeof openSettingsModal === 'function') {
                        addResult('✓ Функция openSettingsModal найдена');
                    } else {
                        addResult('✗ Функция openSettingsModal не найдена', false);
                    }
                }, 100);
            };
            script.onerror = () => addResult('✗ Ошибка загрузки JavaScript файла', false);
            document.head.appendChild(script);
        } catch (e) {
            addResult('✗ Ошибка проверки JavaScript: ' + e.message, false);
        }

        addResult('Тестирование завершено. Проверьте результаты выше.');
    </script>
</body>
</html>
