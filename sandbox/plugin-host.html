<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabVale plugin sandbox</title>
  <style>
    :root {
      --tabvale-bg: transparent;
      --tabvale-text: #e8f2f8;
      --tabvale-muted: #9db4c4;
      --tabvale-accent: #4db6e2;
      --tabvale-surface: rgba(255, 255, 255, 0.06);
      --tabvale-border: rgba(255, 255, 255, 0.12);
      --tabvale-radius: 12px;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--tabvale-bg);
      color: var(--tabvale-text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <script src="plugin-host.js"></script>
</body>
</html>
